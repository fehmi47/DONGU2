<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DÖNGÜ • AI Mutfak Asistanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">DÖNGÜ •</span>
          <span class="brand-sub">AKILLI KİLER &amp; MUTFAK</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a class="nav-link" href="/">Özet</a></li>
        <li><a class="nav-link" href="/">Mutfağım &amp; Kiler</a></li>
        <li><a class="nav-link" href="/">Tariflerim</a></li>
        <li><a class="nav-link" href="/">Etki Paneli</a></li>
        <li><a class="nav-link active" href="/static/chat.html">Asistan</a></li>
      </ul>

      <div class="nav-user">
        <a href="/" class="btn-stitch-outline" style="text-decoration: none; padding: 0.4rem 0.85rem; font-size: 0.82rem;">
          ⬅️ Panele Dön
        </a>
      </div>
    </div>
  </header>

  <!-- SOHBET EKRANI -->
  <main class="main-content" style="max-width: 900px;">
    <div class="chat-card">

      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar-assistant">🌿</div>
          <div>
            <div class="chat-header-title">
              <span>DÖNGÜ Asistanı</span>
            </div>
            <div class="chat-header-status">
              <span class="status-dot"></span>
              <span>Çevrimiçi • Sıfır Atık ve Mutfak Rehberi</span>
            </div>
          </div>
        </div>
        <button type="button" class="btn-new-chat" id="btnNewChat" onclick="handleNewChat()" title="Yeni Sohbet Başlat">
          <span>🔄</span>
          <span>Yeni Sohbet</span>
        </button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- Mesajlar chat.js tarafından eklenir -->
      </div>

      <div class="typing-indicator-row" id="typingIndicator" style="display: none; padding: 0.5rem 1.5rem;">
        <div class="message-avatar">🌿</div>
        <div class="typing-bubble">
          <span>Asistan düşünüyor</span>
          <div class="typing-dots">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      </div>

      <div class="suggestions-bar" id="suggestionsBar">
        <button type="button" class="suggestion-chip" data-question="Bugün ne tüketmeliyim?">
          ⏱️ Bugün ne tüketmeliyim?
        </button>
        <button type="button" class="suggestion-chip" data-question="Ispanakla ne yapabilirim?">
          🥬 Ispanakla ne yapabilirim?
        </button>
        <button type="button" class="suggestion-chip" data-question="Bu ay ne kadar gıda kurtardım?">
          📊 Bu ay ne kadar gıda kurtardım?
        </button>
        <button type="button" class="suggestion-chip" data-question="Ambalajları nasıl ayırayım?">
          ♻️ Ambalajları nasıl ayırayım?
        </button>
      </div>

      <div class="chat-input-container">
        <form class="chat-input-form" id="chatForm" onsubmit="handleChatSubmit(event); return false;">
          <textarea
            id="chatInput"
            class="chat-textarea"
            rows="1"
            placeholder="Bir soru sorun... (örn: Bugün mutfağımda ne pişirebilirim?)"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="chatSendBtn" class="chat-send-btn" title="Gönder">
            <span>Gönder</span>
            <span>➤</span>
          </button>
        </form>
      </div>

    </div>
  </main>

  <footer class="app-footer-stitch">
    <div class="footer-container">
      <div class="footer-left">
        <span class="footer-status-dot"></span>
        <span class="footer-brand-text">DÖNGÜ Eko-Mutfak Envanter Sistemi</span>
      </div>
      <div class="footer-right">
        <span>© 2026 DÖNGÜ</span>
      </div>
    </div>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
